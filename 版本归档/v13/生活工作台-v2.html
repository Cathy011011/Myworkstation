<title>生活工作台 · 六模块</title>
<style>
:root{
  --paper:#f5f0e8; --card:#fffdfa; --ink:#29251f; --muted:#746d63; --line:#ded5c8;
  --plum:#4d3045; --plum-soft:#e8dfe5;
  --terra:#b65f42; --terra-soft:#f3dfd6;
  --sage:#627a67; --sage-soft:#dfe8df;
  --sand:#a57c45; --sand-soft:#eee2ce;
  --red:#b44d43; --green:#477358;
  --shadow:0 16px 40px rgba(63,48,36,.07);
  --radius:22px; --sidebar:248px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}

/* ---------- 布局骨架 ---------- */
.app-shell{display:flex;min-height:100vh}
.sidebar{
  position:fixed; inset:0 auto 0 0; width:var(--sidebar);
  padding:28px 20px 22px; background:#ede6dc;
  border-right:1px solid rgba(104,87,68,.12);
  display:flex; flex-direction:column; z-index:20; overflow-y:auto;
}
.main-content{flex:1; margin-left:var(--sidebar); padding:0 34px 60px; min-width:0}
.topbar{
  position:sticky; top:0; z-index:15; min-height:104px; padding:25px 0 18px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
  background:linear-gradient(180deg,var(--paper) 78%,rgba(245,240,232,0));
}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.page-title{font-size:28px;font-weight:500;letter-spacing:-.01em;margin-top:2px}
.page-sub{font-size:13px;color:var(--muted);margin-top:4px}

/* ---------- 侧栏 ---------- */
.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.brand-mark{
  width:38px;height:38px;border-radius:13px;background:var(--plum);
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.brand-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand-tag{font-size:11px;color:var(--muted)}
.nav-group-label{font-size:10px;letter-spacing:.16em;color:#9a9184;font-weight:700;padding:0 10px 8px}
.nav-i{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;margin-bottom:2px;
  border:none;background:transparent;border-radius:13px;color:var(--muted);
  font-size:13.5px;font-weight:600;text-align:left;transition:background .16s,color .16s
}
.nav-i:hover{background:rgba(255,253,250,.6);color:var(--ink)}
.nav-i.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.nav-i svg{flex-shrink:0;opacity:.72}
.nav-i.active svg{opacity:1}
.side-foot{margin-top:auto;padding-top:18px;border-top:1px solid rgba(104,87,68,.13)}
.sync-pill{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:13px;
  background:var(--sage-soft);font-size:11.5px;font-weight:700;color:var(--sage)
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--sage);flex-shrink:0}

/* ---------- 卡片与面板 ---------- */
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.panel + .panel{margin-top:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.panel-title{font-size:15px;font-weight:700}
.panel-note{font-size:12px;color:var(--muted)}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.hero-card{
  position:relative;overflow:hidden;min-height:220px;padding:30px;
  background:var(--plum);color:#fff;border-radius:var(--radius);box-shadow:var(--shadow)
}
.hero-card:after{
  content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;
  border-radius:50%;background:rgba(255,255,255,.06)
}
.hero-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.66;font-weight:700}
.hero-title{font-size:30px;font-weight:500;letter-spacing:-.02em;margin-top:10px;line-height:1.25}
.hero-desc{font-size:13px;opacity:.78;margin-top:10px;max-width:420px}
.hero-stats{display:flex;gap:26px;margin-top:26px;position:relative;z-index:1}
.hero-stat b{display:block;font-size:25px;font-weight:500;line-height:1.2}
.hero-stat span{font-size:11.5px;opacity:.72}
.metric-label{font-size:12px;color:var(--muted)}
.metric-value{font-size:25px;font-weight:500;line-height:1.28;margin-top:3px}
.metric-foot{font-size:11.5px;color:var(--muted);margin-top:3px}

/* ---------- 控件 ---------- */
.btn{
  min-height:42px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid transparent;border-radius:12px;font-size:13px;font-weight:700;
  transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--plum);color:#fff}
.btn-primary:hover{box-shadow:0 6px 18px rgba(77,48,69,.22)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--card)}
.btn-sage{background:var(--sage);color:#fff}
.btn-warn{background:var(--terra);color:#fff}
.btn-sm{min-height:34px;padding:0 12px;font-size:12px;border-radius:10px}
.btn-danger{background:transparent;border-color:var(--line);color:var(--red)}
input[type=text],input[type=password],input[type=url],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;height:44px;padding:0 12px;border:1px solid #ddd4c8;border-radius:11px;
  background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s
}
textarea{height:auto;min-height:82px;padding:11px 12px;line-height:1.6;resize:vertical}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(98,122,103,.12);border-color:var(--sage)}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>span{color:#746b61;font-size:11px;font-weight:700}
.form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.chip{
  padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;
  font-size:12.5px;font-weight:600;color:var(--muted);transition:all .15s
}
.chip:hover{border-color:var(--sage);color:var(--sage)}
.chip.active{background:var(--plum);border-color:var(--plum);color:#fff}
.tag{
  display:inline-block;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;
  background:var(--sand-soft);color:var(--sand)
}
.tag-plum{background:var(--plum-soft);color:var(--plum)}
.tag-sage{background:var(--sage-soft);color:var(--sage)}
.tag-terra{background:var(--terra-soft);color:var(--terra)}
.search-box{position:relative}
.search-box input{padding-left:36px}
.search-box svg{position:absolute;left:12px;top:14px;opacity:.4}

/* ---------- 列表项 ---------- */
.list-item{
  display:flex;align-items:flex-start;gap:13px;padding:14px 0;
  border-top:1px solid rgba(222,213,200,.62)
}
.list-item:first-child{border-top:none}
.check-box{
  width:20px;height:20px;border-radius:6px;border:1.5px solid #cfc4b4;background:var(--card);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px
}
.check-box:hover{border-color:var(--sage)}
.check-box.on{background:var(--sage);border-color:var(--sage)}
.item-body{flex:1;min-width:0}
.item-title{font-size:14px;font-weight:600}
.item-title.done{text-decoration:line-through;color:var(--muted)}
.item-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:10px}
.time-badge{
  font-size:12px;font-weight:700;color:var(--sage);width:52px;flex-shrink:0;padding-top:1px;
  font-variant-numeric:tabular-nums
}
.icon-btn{
  width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;
  display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;transition:all .15s
}
.icon-btn:hover{background:var(--terra-soft);color:var(--terra)}
.empty-state{
  padding:34px 20px;text-align:center;color:var(--muted);font-size:13px;
  border:1px dashed var(--line);border-radius:15px;margin-top:14px
}
.progress-track{height:7px;border-radius:99px;background:var(--plum-soft);overflow:hidden;margin-top:9px}
.progress-fill{height:100%;border-radius:99px;background:var(--sage);transition:width .4s}
.demo-banner{
  padding:12px 17px;border:1px solid #dba98f;border-radius:15px;background:#f5ded2;
  font-size:12.5px;color:#7a3f24;margin-bottom:16px;display:flex;gap:11px;align-items:flex-start
}
.sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.sync-badge .dot{font-size:9px;line-height:1}
.sync-badge.on{color:#477358;border-color:#bcd6c6;background:#f0f6f2}
.sync-badge.mid{color:#a57c45;border-color:#e5d4b4;background:#faf5ea}
.sync-badge.err{color:#b44d43;border-color:#e3bcb6;background:#faf0ee}
.sync-badge.off{color:#746d63}
.sync-retry{border:none;background:var(--plum);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px;cursor:pointer;margin-left:2px}
.sync-retry:hover{opacity:.85}

/* ---------- 计划卡 ---------- */
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.plan-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;
  border-top:4px solid var(--sand)
}
.plan-card.sage{border-top-color:var(--sage)}
.plan-card.plum{border-top-color:var(--plum)}
.plan-card.terra{border-top-color:var(--terra)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.info-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;
  display:flex;flex-direction:column;gap:11px
}
.quote-block{
  padding:12px 14px;border-left:3px solid var(--sand);background:var(--sand-soft);
  border-radius:0 11px 11px 0;font-size:13px;color:#5c5148;line-height:1.68
}
.note-block{font-size:13px;color:var(--muted);line-height:1.7}
.ai-out{
  min-height:96px;padding:15px;border-radius:13px;background:var(--sage-soft);
  font-size:13.5px;line-height:1.75;color:#31433a
}
.ai-out.waiting{color:var(--muted);background:var(--sand-soft)}

/* ---------- 移动端 ---------- */
.mobile-nav{display:none}
@media(max-width:1180px){
  .dashboard-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  :root{--sidebar:0px}
  .sidebar{display:none}
  .main-content{margin-left:0;padding:0 16px 96px}
  .topbar{min-height:76px;padding:18px 0 14px}
  .page-title{font-size:23px}
  .dashboard-grid{grid-template-columns:1fr}
  .hero-card{padding:24px;min-height:auto}
  .hero-title{font-size:25px}
  .panel{padding:18px}
  .mobile-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(255,253,250,.94);border-top:1px solid var(--line);
    padding:7px 4px calc(7px + env(safe-area-inset-bottom));
    justify-content:space-around;backdrop-filter:blur(14px)
  }
  .mn-i{
    flex:1;border:none;background:transparent;padding:6px 2px;display:flex;flex-direction:column;
    align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);border-radius:11px
  }
  .mn-i.active{color:var(--plum);background:var(--plum-soft)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* 云端值 → 本地值的宽容解析 */
function cloudText(v){ if(v==null) return ''; if(typeof v==='string') return v;
  if(typeof v==='object'){
    if(v.length!==undefined&&typeof v.length==='number'){ var o=v[0]||{}; return o.link||o.text||''; }
    return v.link||v.text||v.name||'';
  } return String(v); }
function cloudBool(v){ return v===true||v==='true'; }
function cloudArr(v){ if(Array.isArray(v)) return v; if(typeof v==='string'&&v){ return v.split(/[,，、]\s*/).filter(Boolean); } return v?[v]:[]; }
function cloudDate(v){ if(!v) return ''; var s=String(v); return s.length>=10?s.slice(0,10):s; }

function toRecord(mod,item){
  var props={};
  MAPPING[mod].forEach(function(m){
    if(m.w){
      var val=m.w(item[m.k]);
      if(val!==null&&val!==undefined) props[m.f]=val;
    }else{
      /* 无专门转换的字段按 text 推送（标题/时间/地点/内容等文本主体，缺了就是空壳记录） */
      props[m.f]={text:(item[m.k]==null?'':String(item[m.k]))};
    }
  });
  return props;
}
function fromRecord(mod,recId,props){
  var item={id:recId};
  MAPPING[mod].forEach(function(m){
    var raw=props?props[m.f]:undefined;
    if(m.r){ item[m.k]=m.r(raw); }
    else{
      /* 富文本容错：{text:'x'} 形态解包为字符串（服务端 REST 平铺格式返回此形态） */
      if(raw&&typeof raw==='object'&&typeof raw.text==='string') raw=raw.text;
      item[m.k]=(raw==null?'':raw);
    }
  });
  return item;
}

}

/* ---- 资料库 API 封装（页面沙盒内由平台注入） ---- */
function cloudApi(){
  var db=(typeof __SMART_PAGE__!=='undefined')&&__SMART_PAGE__&&__SMART_PAGE__.database;
  return db||null;
}
function cloudQueryAll(dbId){
  var db=cloudApi(); if(!db) return Promise.reject(new Error('NO_CLOUD_API'));
  var all=[], token=null;
  function step(){
    var req={databaseId:dbId, pageSize:100};
    if(token) req.pageToken=token;
    return db.query(req).then(function(res){
      /* 双格式兼容：SDK 契约 {records:[{id,properties}]} / REST 平铺 {results:[{字段:值,record_id}]} */
      var raw=(res&&(res.records||res.results))||[];
      raw.forEach(function(r){
        if(r&&r.properties&&(r.id||r.record_id)) all.push({id:r.id||r.record_id, properties:r.properties});
        else{
          var props={}, rid=r?((r.record_id!==undefined&&r.record_id)||r.id):'';
          Object.keys(r||{}).forEach(function(k){ if(k!=='record_id') props[k]=r[k]; });
          all.push({id:rid, properties:props});
        }
      });
      var nt=res&&res.nextPageToken!==undefined?res.nextPageToken:(res&&res.next_cursor)||null;
      if(nt){ token=nt; return step(); }
      return all;
    });
  }
  return step();
}
function cloudAdd(dbId,props){
  var db=cloudApi(); if(!db) return Promise.reject(new Error('NO_CLOUD_API'));
  return db.addRecord({databaseId:dbId, properties:props});
}
function cloudUpdate(dbId,recId,props){
  var db=cloudApi(); if(!db) return Promise.reject(new Error('NO_CLOUD_API'));
  return db.updateRecord({databaseId:dbId, recordId:recId, properties:props});
}
function cloudDelete(dbId,recId){
  var db=cloudApi(); if(!db) return Promise.reject(new Error('NO_CLOUD_API'));
  return db.deleteRecord({databaseId:dbId, recordId:recId});
}

/* ---- 同步状态机：idle(离线) / syncing / online / error ---- */
var syncState={ mode:'init', pending:0, msg:'' };
var pushing=false;
var pullDone=false;     /* 首次云端拉取是否完成 */

function buildSnapshot(){
  var s={};
  Object.keys(DB_IDS).forEach(function(mod){
    s[mod]={};
    (data[mod]||[]).forEach(function(it){ s[mod][it.id]=JSON.stringify(toRecord(mod,it)); });
  });
  return s;
}
function snapOf(mod){ if(!snapshot[mod]) snapshot[mod]={}; return snapshot[mod]; }
/* 该模块本地是否有未推送到云端的变更 */
function modHasDirty(mod){
  var cur={};
  (data[mod]||[]).forEach(function(it){ cur[it.id]=JSON.stringify(toRecord(mod,it)); });
  var snap=snapshot[mod]||{};
  var ids=Object.keys(cur);
  if(ids.length!==Object.keys(snap).length) return true;
  for(var i=0;i<ids.length;i++){ if(cur[ids[i]]!==snap[ids[i]]) return true; }
  return false;
}

/* save()：本地持久化 + 异步推送 diff 到云端（渲染函数不调用此逻辑，事件层统一走这里） */
function save(){
  persistLocal();
  if(!pullDone) return;          /* 首次拉取完成前不推送，避免把缓存当新增 */
  schedulePush();
}

var pushDirty=false;   /* 推送期间若有新写入，完成后补推一轮 */
var pushDoneCb=null;   /* 推送完成后的回调（刷新云端数据：先推后拉） */
function schedulePush(onDone){
  if(pushing){
    pushDirty=true;
    if(typeof onDone==='function') pushDoneCb=onDone;
    return;
  }
  if(typeof onDone==='function') pushDoneCb=onDone;
  pushing=true;
  setSync('syncing');
  var snap=snapshot, ops=[];
  Object.keys(DB_IDS).forEach(function(mod){
    var cur={};
    (data[mod]||[]).forEach(function(it){ cur[it.id]=JSON.stringify(toRecord(mod,it)); });
    Object.keys(cur).forEach(function(id){
      if(!(id in snap[mod])) ops.push({op:'add',mod:mod,id:id,props:JSON.parse(cur[id]),json:cur[id]});
      else if(snap[mod][id]!==cur[id]) ops.push({op:'upd',mod:mod,id:id,props:JSON.parse(cur[id]),json:cur[id]});
    });
    Object.keys(snap[mod]).forEach(function(id){
      if(!(id in cur)) ops.push({op:'del',mod:mod,id:id});
    });
  });
  /* 墓碑重试：未确认删除的 id，补发软删除（优先用认出的云端真身 id）直到裁决确认 */
  Object.keys(tombs).forEach(function(mod){
    if(!DB_IDS[mod]) return;
    var t=tombs[mod]||{}, sn=snapshot[mod]||{}, pend={};
    ops.forEach(function(o){ if(o.op==='del') pend[o.mod+':'+o.id]=1; });
    Object.keys(t).forEach(function(id){
      var e=(typeof t[id]==='object'&&t[id])?t[id]:{};
      var target=e.cloudId||id;
      if(!(target in sn)&&!pend[mod+':'+target]){ ops.push({op:'del',mod:mod,id:target}); pend[mod+':'+target]=1; }
    });
  });

  if(ops.length===0){
    pushing=false;
    var cb0=pushDoneCb; pushDoneCb=null;
    if(pushDirty){ pushDirty=false; return schedulePush(); }
    setSync(pullDone?'online':'idle');
    if(typeof cb0==='function') cb0();
    return;
  }

  var tasks=ops.map(function(o){
    if(o.op==='add') return cloudAdd(DB_IDS[o.mod],o.props);
    if(o.op==='upd') return cloudUpdate(DB_IDS[o.mod],o.id,o.props);
    /* 软删除：打「已删除」标记而非调 delete 接口（后者曾出现假成功→幽灵复活） */
    return cloudUpdate(DB_IDS[o.mod],o.id,{'已删除':{checkbox:true}});
  });

  Promise.all(tasks.map(function(t){ return t.then(function(r){ return {ok:true,rec:r}; },
                                              function(e){ return {ok:false,err:e}; }); }))
  .then(function(results){
    pushing=false;
    var failMsgs=[], loginExpired=false;
    results.forEach(function(r,i){
      var o=ops[i];
      if(r.ok){
        /* 逐项对齐快照：成功项标记已同步，失败项下轮继续 diff */
        if(o.op==='add'){
          /* SDK 返回体可能不含 id：取不到时保留本地原 id（绝不改成 null，否则后续删除/更新全部失效） */
          var rr=r.rec;
          var nid=(typeof rr==='string')?rr:(rr&&(rr.id!==undefined&&rr.id!==null?rr.id:(rr.record_id!==undefined&&rr.record_id!==null?rr.record_id:null)))||null;
          if(nid&&nid!==o.id){
            renameId(o.mod,o.id,nid);
            var it2=null;
            (data[o.mod]||[]).forEach(function(x){ if(x.id===nid) it2=x; });
            snapshot[o.mod][nid]=it2?JSON.stringify(toRecord(o.mod,it2)):o.json;
          }else{
            snapshot[o.mod][o.id]=o.json;   /* 保留本地 id 标记已同步；真实云端 id 延迟 pull 对齐 */
            scheduleIdAlign();
          }
        }else if(o.op==='upd'){
          snapshot[o.mod][o.id]=o.json;
        }else{
          delete snapshot[o.mod][o.id];
          /* 墓碑保留：等拉取裁决确认云端真已删后再解除（防 updateRecord 假成功→复活） */
          scheduleIdAlign();   /* 软删除后拉取验证，确保云端标记生效 */
        }
      }else{
        /* 失败项：保留快照与墓碑，下轮自动重试；删除失败绝不本地"假装已删"（v8 教训：会幽灵复活） */
        var em=String((r.err&&r.err.message)||r.err);
        if(/401|not login|未登录|登录|permission|forbidden/i.test(em)) loginExpired=true;
        failMsgs.push(em.slice(0,40));
      }
    });
    persistLocal();
    var failN=failMsgs.length;
    syncState.pending=failN;
    if(failN===0){ setSync('online'); }
    else if(loginExpired){ setSync('error','登录已过期 · 请刷新页面重新登录 WorkBuddy 后点重试'); }
    else{ setSync('error', failN+' 条未同步 · '+failMsgs[0]); }
    renderSyncBadge();
    if(pushDirty){ pushDirty=false; schedulePush(); }
    else{
      var cb=pushDoneCb; pushDoneCb=null;
      if(typeof cb==='function') cb();
    }
  });
}

function renameId(mod,oldId,newId){
  if(!oldId||!newId) return;   /* 禁止把条目 id 改成空值 */
  (data[mod]||[]).forEach(function(it){ if(it.id===oldId) it.id=newId; });
}

/* addRecord 返回体不含 id 时的兜底：延迟拉取云端，用真实 record_id 对齐本地条目 */
var alignTimer=null;
function scheduleIdAlign(){
  if(alignTimer) return;
  alignTimer=setTimeout(function(){
    alignTimer=null;
    if(cloudApi()&&pullDone) pullAll();
  },2500);
}

/* 从云端全量拉取；表为空时推送示例数据（保证任何设备首开不空白） */
/* 沙盒 postMessage 握手可能在页面 load 时未完成 → 首次调用会挂起，必须超时重试 */
var pullAttempt=0;
function pullAll(){
  if(!cloudApi()){ setSync('idle','沙盒外 · 本地模式'); renderSyncBadge(); return Promise.resolve(false); }
  setSync('syncing'); renderSyncBadge();
  var mods=Object.keys(DB_IDS);
  var timeoutP=new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('连接超时')); },15000); });
  Promise.race([timeoutP]).catch(function(){}); /* 保持浏览器不报未处理 rejection */
  return Promise.race([
    Promise.all(mods.map(function(mod){
      return cloudQueryAll(DB_IDS[mod]).then(function(records){
        var t=tombs[mod]||(tombs[mod]={});
        /* 墓碑裁决（v13）：
           1) 按本地 id 或已记录的云端真身 id 找到记录：已删除=true → 解除墓碑；仍活跃 → 记住真身并继续隐藏、补推删除
           2) 按 id 找不到 → 用内容指纹认出错位真身（本地假 id 场景），同样隐藏并补删
           3) 都找不到 → 绝不解除墓碑（旧版"查不到就解除"会让记录复活），仅 7 天未确认才清理 */
        var t=tombs[mod]||(tombs[mod]={});
        normalizeTombs();
        var now=Date.now(), FP_WINDOW=2*3600*1000, EXPIRE=7*24*3600*1000;
        var byId={}; records.forEach(function(r){ byId[r.id]=r; });
        var hidden={};
        Object.keys(t).forEach(function(id){
          var e=t[id];
          var rec=byId[id]||byId[e.cloudId]||null;
          if(rec){
            if(rec.properties&&rec.properties['已删除']===true){ delete t[id]; return; }
            e.cloudId=rec.id; e.seen=true; hidden[rec.id]=1; hidden[id]=1; return;
          }
          var hit=null;
          if(e.fp&&(now-(e.ts||0))<FP_WINDOW){
            records.forEach(function(r){
              if(hit||(r.properties&&r.properties['已删除']===true)) return;
              if(fpOf(mod,fromRecord(mod,r.id,r.properties))===e.fp) hit=r;
            });
          }
          if(hit){ e.cloudId=hit.id; e.seen=true; hidden[hit.id]=1; hidden[id]=1; return; }
          if(now-(e.ts||0)>EXPIRE){ delete t[id]; return; }
          hidden[id]=1;   /* 未确认：继续隐藏，等下次同步补删 */
        });
        /* 过滤：云端已软删的不进本地；墓碑未决的（含错位真身）绝不复活 */
        return {raw:records,
                list:records.filter(function(r){
                  return !(r.properties&&r.properties['已删除']===true)&&!hidden[r.id];
                }).map(function(r){ return fromRecord(mod,r.id,r.properties); })};
      });
    })),
    timeoutP
  ]).then(function(resArr){
    var arr=resArr.map(function(x){ return x.list; });
    var rawArr=resArr.map(function(x){ return x.raw; });
    /* 防数据丢失核心策略：
       - 云端模块有数据 → 用云端覆盖本地（多端一致性）
       - 云端模块为空 → 绝不覆盖本地！保留本地数据并推回云端（查询失败被静默吞成空结果时，这样保住数据）
       - 首次使用（本地也空）→ 灌入示例数据 */
    var emptyAndKept=[], seeded=[], dirtyKept=[];
    mods.forEach(function(mod,i){
      var cloud=arr[i], local=data[mod]||[];
      if(local.length===0){
        /* 本机该模块无数据：云端有原始记录就取云端（即使全被墓碑过滤也不灌示例），两边都空则首开灌示例 */
        if(rawArr[i].length>0){ data[mod]=cloud; }
        else{
          var s=seed();
          if(s[mod]&&s[mod].length){ data[mod]=s[mod]; seeded.push(mod); }
        }
      }else if(rawArr[i].length===0){
        /* 云端空（按原始记录数判断，防止墓碑过滤造成误判）+ 本地有：绝不覆盖，保留本地并推回云端 */
        emptyAndKept.push(mod);
      }else if(modHasDirty(mod)){
        /* 云端有 + 本地有未推送的修改：保留本地（等推送成功后再刷新），防止拉取覆盖本机新内容 */
        dirtyKept.push(mod);
      }else{
        data[mod]=cloud;         /* 本地与云端对齐（本地无未推变更）→ 安全覆盖 */
      }
    });
    pullDone=true;
    snapshot=buildSnapshot();
    emptyAndKept.forEach(function(m){ snapshot[m]={}; });
    seeded.forEach(function(m){ snapshot[m]={}; });
    /* dirtyKept 的模块保留本地原快照（不动），等 push 完成后自然对齐 */
    persistLocal();
    pullAttempt=0;
    setSync('online');
    render();
    if(emptyAndKept.length||seeded.length||dirtyKept.length){
      var hint=[];
      if(emptyAndKept.length) hint.push('云端为空的模块已保留本机数据（'+emptyAndKept.map(function(m){return VIEW_NAME[m]||m;}).join('、')+'），正在推回云端');
      if(dirtyKept.length) hint.push(dirtyKept.map(function(m){return VIEW_NAME[m]||m;}).join('、')+' 有本机修改尚未同步，已保留，稍后重试同步');
      if(seeded.length) hint.push('新模块已灌入示例数据');
      syncState.msg=hint.join('；');
    }
    renderSyncBadge();
    if(emptyAndKept.length||seeded.length||dirtyKept.length) schedulePush();   /* dirtyKept 也自动补推：本机修改（含墓碑）不再永远等手动 */
    return true;
  }).catch(function(e){
    if(pullAttempt<4){
      pullAttempt++;
      setSync('syncing'); renderSyncBadge();
      setTimeout(pullAll, 2500);
      return false;
    }
    setSync('error','云端读取失败 · '+String(e.message||e).slice(0,60));
    renderSyncBadge();
    return false;
  });
}

/* 多终端同步入口：先推本地未同步变更，成功后再拉云端（防覆盖丢数据） */
function syncAndPull(){
  if(!cloudApi()||!pullDone){ return; }
  setSync('syncing'); renderSyncBadge();
  schedulePush(function(){
    if(syncState.pending===0){ pullAll(); }
    else{ /* 仍有未同步项：拉取会用旧云端数据覆盖本机修改，跳过等待重试 */ }
  });
}
/* 切回页面标签时自动同步，保证多端切换后看到的是最新数据 */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&pullDone&&!pushing) syncAndPull();
});

function setSync(mode,msg){
  syncState.mode=mode;
  if(msg!==undefined) syncState.msg=msg;
  if(mode==='online'){ syncState.pending=0; syncState.msg=''; }
  renderSyncBadge();
}
function syncBadge(){
  if(syncState.mode==='online') return {cls:'on', txt:'已同步', dot:'●'};
  if(syncState.mode==='syncing') return {cls:'mid', txt:'同步中…', dot:'◐'};
  if(syncState.mode==='error') return {cls:'err', txt:('同步异常'+(syncState.pending?'（'+syncState.pending+'）':'')), dot:'○'};
  return {cls:'off', txt:(syncState.msg||'离线模式'), dot:'○'};
}
function renderSyncBadge(){
  var el=document.getElementById('syncBadge'); if(!el) return;
  var b=syncBadge();
  el.className='sync-badge '+b.cls;
  el.innerHTML='<span class="dot">'+b.dot+'</span>'+esc(b.txt)
    +(syncState.mode==='error'?' <button class="sync-retry" data-act="sync-retry">重试</button>':'');
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

    .sort(function(a,b){return a.start<b.start?-1:1;});
}
function openTodos(){
  return data.todo.filter(function(t){return !t.done;});
}

  document.getElementById('tbEyebrow').textContent=v.eyebrow;
  document.getElementById('tbTitle').textContent=v.name;
  document.getElementById('tbSub').textContent=v.sub;
  var root=document.getElementById('viewRoot');

    +'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'
    +'<span>数据已接入<b>资料库在线数据表</b>：新增、修改、删除即时写回云端，换设备、换浏览器打开都是同一份数据。</span></div>';

  var body='';
  if(state.view==='overview') body=renderOverview();
  else if(state.view==='schedule') body=renderSchedule();
  else if(state.view==='todo') body=renderTodo();
  else if(state.view==='translate') body=renderTranslate();

  else body=renderInfo();

}

/* ============ AI 调用（OpenAI 兼容协议，支持中转站） ============ */
function getCfg(){
  try{ return JSON.parse(localStorage.getItem('lwb_llm')||'null'); }catch(e){ return null; }
}
function cfgReady(c){ return !!(c&&c.baseURL&&c.model&&c.key); }
/* 中转站通道波动大（实测 glm 与 gpt 通道轮流过载）：主模型失败时自动换备用模型重试一次 */
var FALLBACK_MODELS=['gpt-5.6-sol','glm-5.3-flash'];
function callLLM(cfg,messages,maxTokens,tryNum){
  tryNum=tryNum||0;
  return fetch(cfg.baseURL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body:JSON.stringify({model:cfg.model,messages:messages,max_tokens:maxTokens||700,stream:false})
  }).then(function(r){
    if(!r.ok){
      return r.text().then(function(t){
        var msg='HTTP '+r.status;
        if(r.status===429) msg='服务繁忙（429 限流）——中转站该模型通道过载';
        else if(r.status===401||r.status===403) msg='鉴权失败（'+r.status+'）——检查密钥是否正确';
        else if(r.status===404) msg='接口地址不存在（404）——检查接口地址是否填到 /v1/chat/completions';
        else if(t) msg+=' '+String(t).slice(0,100);
        var e=new Error(msg); e.noFallback=(r.status===401||r.status===403||r.status===404);
        throw e;
      });
    }
    return r.json();
  }).then(function(d){
    var c=d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
    if(!c) throw new Error('响应里没有内容');
    return String(c).trim();
  }).catch(function(err){
    /* 瞬时类失败（限流/超时/网络/空响应）→ 换备用模型自动重试一次；鉴权/地址错误重试无意义 */
    if(tryNum===0&&!err.noFallback){
      var fb=null;
      for(var i=0;i<FALLBACK_MODELS.length;i++){ if(FALLBACK_MODELS[i]!==cfg.model){ fb=FALLBACK_MODELS[i]; break; } }
      if(fb){
        cfg.model=fb;   /* 如实反映实际使用的模型（写入翻译/问答记录） */
        return callLLM(cfg,messages,maxTokens,1);
      }
    }
    throw err;
  });
}

/* ============ 事件 ============ */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el) return;
  var act=el.getAttribute('data-act');
  var id=el.getAttribute('data-id');

  if(act==='go'){ state.view=el.getAttribute('data-view'); render(); return; }
  if(act==='del'){
    var kind=el.getAttribute('data-kind');
    var victim=null;
    (data[kind]||[]).forEach(function(r){ if(r.id===id) victim=r; });
    data[kind]=data[kind].filter(function(r){return r.id!==id;});
    if(DB_IDS[kind]&&id){
      (tombs[kind]||(tombs[kind]={}))[id]={fp:fpOf(kind,victim),cloudId:null,seen:false,ts:Date.now()};
    }
    save(); render(); return;
  }
  if(act==='toggle-todo'){
    data.todo.forEach(function(t){
      if(t.id===id){ t.done=!t.done; t.status=t.done?'已完成':'进行中'; }
    });
    save(); render(); return;
  }
  if(act==='add-schedule'){
    var t=document.getElementById('scTitle').value.trim();
    if(!t) return alert('先写个标题');
    data.schedule.push({
      id:uid(), title:t, date:document.getElementById('scDate').value,
      start:document.getElementById('scStart').value, end:document.getElementById('scEnd').value,
      type:document.getElementById('scType').value, place:document.getElementById('scPlace').value.trim(),
      status:'待开始', remind:true, note:''
    });
    save(); render(); return;
  }
  if(act==='add-todo'){
    var td=document.getElementById('tdTitle').value.trim();
    if(!td) return alert('先写个标题');
    data.todo.push({
      id:uid(), title:td, priority:document.getElementById('tdPriority').value,
      status:'待办', done:false, due:document.getElementById('tdDue').value,
      domain:document.getElementById('tdDomain').value, week:CUR_WEEK
    });
    save(); render(); return;
  }
  if(act==='do-translate'){
    var src=document.getElementById('trSrc').value.trim();
    if(!src) return alert('先填原文');
    var out=document.getElementById('trOut');
    var cfg=getCfg();
    if(!cfgReady(cfg)){
      out.className='ai-out waiting';
      out.textContent='还没配置模型。点上方「配置密钥」，填接口地址、模型名和密钥（支持 OpenAI 兼容中转站）。';
      return;
    }
    var sl=document.getElementById('trSL').value;
    var tl=document.getElementById('trTL').value;
    var tg=document.getElementById('trTag').value.trim();
    out.className='ai-out waiting'; out.textContent='正在调用 '+cfg.model+' …';
    callLLM(cfg,[{role:'user',content:'你只输出译文本身，不要解释、不要引号。把下面内容从'+sl+'翻译成'+tl+'：\n'+src}]).then(function(dst){
      data.translate.unshift({id:uid(),src:src,dst:dst,srcLang:sl,tgtLang:tl,model:cfg.model,status:'已完成',method:'页面直连',fav:false,tags:tg?[tg]:[],created:TODAY});
      save(); render();
      var o=document.getElementById('trOut'); if(o){o.className='ai-out';o.textContent=dst;}
    }).catch(function(err){
      out.className='ai-out waiting';
      out.textContent='调用失败：'+err.message+'。原文已保留，检查配置后可重试。';
    });
    return;
  }
  if(act==='fav-tr'){
    data.translate.forEach(function(r){ if(r.id===id) r.fav=!r.fav; });
    save(); render(); return;
  }
  if(act==='do-ask'){
    var q=document.getElementById('qaQ').value.trim();
    if(!q) return alert('先写下问题');
    var out2=document.getElementById('qaOut');
    var cfg2=getCfg();
    if(!cfgReady(cfg2)){
      out2.className='ai-out waiting';
      out2.textContent='还没配置模型。点上方「配置密钥」，填接口地址、模型名和密钥。';
      return;
    }
    var tg2=document.getElementById('qaTag').value.trim();
    out2.className='ai-out waiting'; out2.textContent='正在调用 '+cfg2.model+' 思考…';
    callLLM(cfg2,[{role:'user',content:q+'\n\n（请用简洁的中文回答，分点说明，控制在 300 字内。）'}]).then(function(a){
      data.qa.unshift({id:uid(),q:q,a:a,model:cfg2.model,status:'已完成',tags:tg2?[tg2]:[],archived:false,rating:0,created:TODAY});
      save(); render();
      var o2=document.getElementById('qaOut'); if(o2){o2.className='ai-out';o2.textContent=a;}
    }).catch(function(err){
      out2.className='ai-out waiting';
      out2.textContent='调用失败：'+err.message+'。问题已保留，检查配置后可重试。';
    });
    return;
  }
  if(act==='archive-qa'){
    data.qa.forEach(function(r){ if(r.id===id) r.archived=!r.archived; });
    save(); render(); return;
  }
  if(act==='add-plan'){
    var pt=document.getElementById('plTitle').value.trim();
    if(!pt) return alert('先写个标题');
    var cyc=document.getElementById('plCycle').value;
    var key=cyc==='本周'?CUR_WEEK:(cyc==='下周'?NEXT_WEEK:'2026-09');
    var st=cyc==='本周'?TODAY:(cyc==='下周'?addDays(TODAY,7):TODAY);
    var en=cyc==='本周'?addDays(TODAY,6):(cyc==='下周'?addDays(TODAY,13):'2026-09-30');
    data.plan.push({
      id:uid(), title:pt, cycle:cyc, cycleKey:key, start:st, end:en,
      progress:0, status:'未开始', kr:document.getElementById('plKr').value.trim(),
      domain:document.getElementById('plDomain').value
    });
    save(); render(); return;
  }
  if(act==='bump-plan'){
    data.plan.forEach(function(p){
      if(p.id===id){
        p.progress=Math.min(100,p.progress+10);
        p.status=p.progress>=100?'已完成':(p.progress>0?'进行中':'未开始');
      }
    });
    save(); render(); return;
  }
  if(act==='add-info'){
    var it=document.getElementById('inTitle').value.trim();
    if(!it) return alert('先起个标题');
    var tg3=document.getElementById('inTag').value.trim();
    data.info.unshift({
      id:uid(), title:it, sourceName:document.getElementById('inSrcName').value.trim(), link:'',
      quote:document.getElementById('inQuote').value.trim(),
      note:document.getElementById('inNote').value.trim(),
      tags:tg3?[tg3]:['未分类'], archived:false, rating:0, created:TODAY
    });
    save(); render(); return;
  }
  if(act==='archive-info'){
    data.info.forEach(function(i){ if(i.id===id) i.archived=!i.archived; });
    save(); render(); return;
  }
  if(act==='filter-todo'){ state.todoFilter=el.getAttribute('data-v'); render(); return; }
  if(act==='filter-plan'){ state.planFilter=el.getAttribute('data-v'); render(); return; }
  if(act==='filter-qa'){ state.qaFilter=el.getAttribute('data-v'); render(); return; }
  if(act==='filter-info'){ state.infoFilter=el.getAttribute('data-v'); render(); return; }
  if(act==='open-settings'){
    try{
      var cfg=JSON.parse(localStorage.getItem('lwb_llm')||'{}');
      document.getElementById('cfgProvider').value=cfg.provider||'custom';
      document.getElementById('cfgBase').value=cfg.baseURL||'';
      document.getElementById('cfgModel').value=cfg.model||'';
      document.getElementById('cfgKey').value=cfg.key||'';
    }catch(e){}
    document.getElementById('settingsMask').style.display='flex'; return;
  }
  if(act==='close-settings'){ document.getElementById('settingsMask').style.display='none'; return; }
  if(act==='save-settings'){
    localStorage.setItem('lwb_llm',JSON.stringify({
      provider:document.getElementById('cfgProvider').value,
      baseURL:document.getElementById('cfgBase').value.trim(),
      model:document.getElementById('cfgModel').value.trim(),
      key:document.getElementById('cfgKey').value.trim()
    }));
    document.getElementById('settingsMask').style.display='none';
    alert('已保存到本机浏览器。翻译和问答现在会用这里的配置实时调用。');
    return;
  }
  if(act==='test-connection'){
    var tc={baseURL:document.getElementById('cfgBase').value.trim(),
            model:document.getElementById('cfgModel').value.trim(),
            key:document.getElementById('cfgKey').value.trim()};
    if(!tc.baseURL||!tc.model||!tc.key) return alert('先把接口地址、模型、密钥填全再测试');
    el.textContent='测试中…'; el.disabled=true;
    callLLM(tc,[{role:'user',content:'回复两个字：可用'}],10).then(function(t){
      el.textContent='测试连接'; el.disabled=false;
      alert('连通成功，模型返回：'+t.slice(0,60));
    }).catch(function(e){
      el.textContent='测试连接'; el.disabled=false;
      alert('连通失败：'+e.message);
    });
    return;
  }
  if(act==='refresh-cloud'){
    syncAndPull();
    return;
  }
  if(act==='sync-retry'){
    schedulePush();
    return;
  }
  if(act==='reset-demo'){
    if(confirm('把演示数据恢复到初始状态？你自己新增的内容会消失。')){
      data=seed(); save(); render();
    }
    return;
  }
});

document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='trSearch'||id==='inSearch'){
    state.q=e.target.value.trim();
    clearTimeout(window.__t);
    window.__t=setTimeout(function(){
      var pos=e.target.selectionStart;
      render();
      var box=document.getElementById(id);
      if(box){ box.focus(); try{ box.setSelectionRange(pos,pos); }catch(err){} }
    },380);
  }
});

pullAll();
